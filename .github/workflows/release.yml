# 发布工作流：push v* tag 时在三大平台打包并发布到 GitHub Releases
# 触发：git tag v1.0.1 && git push origin v1.0.1
# 产物：Windows NSIS 安装包 / macOS DMG (x64 + arm64) / Linux AppImage + deb
#
# 签名（可选，未配置则跳过）：
#   Windows: Secrets 配置 CSC_LINK (PFX base64) + CSC_KEY_PASSWORD
#   macOS:   Secrets 配置 CSC_LINK (.p12 base64) + CSC_KEY_PASSWORD
#            公证需额外配置 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 Release 必需

jobs:
  # 前置任务：先创建唯一的草稿 Release，避免 4 个 matrix 任务并行竞态各自创建草稿
  # （否则同一 tag 会出现多个 Release 列表，产物被分散到不同草稿中）
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 已存在（重跑场景）则跳过创建，保证整个 tag 只有一个 Release
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "$TAG" --generate-notes

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-14, ubuntu-22.04]
        include:
          - os: windows-latest # -> x64 nsis
            platform: win
          - os: windows-11-arm # -> arm64 nsis
            platform: win
          - os: macos-14 # Apple Silicon -> arm64 dmg
            platform: mac
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # publish 配置已在 electron-builder.yml 中定义为 github provider，
      # 这里显式 --publish=always 触发上传到 GitHub Releases（草稿）
      - name: Build & Release (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # —— 代码签名（可选，配置 Secret 后自动启用）——
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # —— macOS 公证（可选）——
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run build:${{ matrix.platform }} --publish=always

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
          retention-days: 30
